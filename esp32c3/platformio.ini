; Pick the environment that matches your panel:
;   pio run -e round  -t upload    (round  240x240, GC9A01)
;   pio run -e square -t upload    (square 240x240, ST7789)
[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Serial over the C3's native USB port
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:round]
build_flags = ${env.build_flags} -DDISPLAY_GC9A01
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit GC9A01A

[env:square]
build_flags = ${env.build_flags}
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
